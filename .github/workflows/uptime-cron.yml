name: Uptime monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run uptime checks
        run: |
          curl -s "https://cyberguard-production-f12b.up.railway.app/api/uptime/run?secret=${{ secrets.CRON_SECRET }}"
